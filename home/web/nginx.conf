worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  upstream home_api {
    server home-api:8082;
  }
  server {
    listen 80;
    root /usr/share/nginx/html;
    # Connect: SPA baseUrl=/api → /api/home.v1.HomeService/...；后端挂在 /home.v1.HomeService/
    # （与 TLB /api 去前缀、vite rewrite 一致）
    location /api/home.v1.HomeService/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api(/home\.v1\.HomeService/.*)$ $1 break;
      proxy_pass http://home_api;
    }
    # REST: google.api.http get=/api/sites（原样转发）
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass http://home_api;
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
