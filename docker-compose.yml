name: golang

services:
  consul:
    build:
      context: .
      dockerfile: Dockerfile.consul
    image: minikitex-consul:local
    hostname: consul
    command: ["agent", "-dev", "-client=0.0.0.0", "-bind=0.0.0.0", "-ui"]
    ports:
      - "8500:8500"

  etcd:
    build:
      context: .
      dockerfile: Dockerfile.etcd
    image: minikitex-etcd:local
    hostname: etcd
    command:
      - --name=etcd
      - --data-dir=/data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    tmpfs:
      - /data

  etcdui:
    build:
      context: .
      args:
        BIN: etcdui
    image: minikitex-etcdui:local
    environment:
      LISTEN: "0.0.0.0:2381"
      ETCD: "http://etcd:2379"
    ports:
      - "2381:2381"
    depends_on:
      - etcd

  user-1:
    build:
      context: .
      args:
        BIN: user
    image: minikitex-user:local
    hostname: user-1
    environment:
      LISTEN: "0.0.0.0:8888"
      INSTANCE: user-1
      REGISTRY: "http://consul:8500"
      SERVICE_NAME: "user"
      ADVERTISE: "user-1:8888"
      PSM: "user"
      METRICS: "0.0.0.0:9091"
      JAEGER: "http://jaeger:9411/api/v2/spans"
      CONFIG: "http://etcd:2379"
    labels:
      psm: user
    expose:
      - "8888"
      - "9091"
    depends_on:
      - consul
      - jaeger
      - etcd

  user-2:
    build:
      context: .
      args:
        BIN: user
    image: minikitex-user:local
    hostname: user-2
    environment:
      LISTEN: "0.0.0.0:8888"
      INSTANCE: user-2
      REGISTRY: "http://consul:8500"
      SERVICE_NAME: "user"
      ADVERTISE: "user-2:8888"
      PSM: "user"
      METRICS: "0.0.0.0:9091"
      JAEGER: "http://jaeger:9411/api/v2/spans"
      CONFIG: "http://etcd:2379"
    labels:
      psm: user
    expose:
      - "8888"
      - "9091"
    depends_on:
      - consul
      - jaeger
      - etcd

  order:
    build:
      context: .
      args:
        BIN: order
    image: minikitex-order:local
    hostname: order-1
    environment:
      LISTEN: "0.0.0.0:8889"
      INSTANCE: order-1
      REGISTRY: "http://consul:8500"
      SERVICE_NAME: "user"
      PSM: "order"
      METRICS: "0.0.0.0:9091"
      JAEGER: "http://jaeger:9411/api/v2/spans"
    labels:
      psm: order
    ports:
      - "8889:8889"
      - "18080:8080"
    expose:
      - "9091"
    depends_on:
      - consul
      - user-1
      - user-2
      - jaeger

  # 分布式 AGW：和 order 共用网络，HTTP 进这台实例，本机转 RPC。
  gateway:
    build:
      context: .
      args:
        BIN: gateway
    image: minikitex-gateway:local
    network_mode: "service:order"
    environment:
      LISTEN: "0.0.0.0:8080"
      IDL: /idl/order.thrift
      ORDER_ADDR: "127.0.0.1:8889"
      INSTANCE: order-agw
      PSM: "gateway"
    labels:
      psm: gateway
    volumes:
      - ${HOST_ROOT:-.}/idl:/idl:ro
    depends_on:
      - order

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOST_ROOT:-.}/observability/promtail.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "9090:9090"
    volumes:
      - ${HOST_ROOT:-.}/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - user-1
      - user-2
      - order

  platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
    image: minikitex-platform:local
    hostname: platform
    working_dir: /work
    environment:
      LISTEN: "0.0.0.0:8081"
      MYSQL: "root:minikitex@tcp(mysql:3306)/minikitex?parseTime=true&charset=utf8mb4"
      WEB_DIR: /web
      HOST_ROOT: ${PWD}
    ports:
      - "5173:8081"
    volumes:
      - ${HOST_ROOT:-.}:/work
      - scm-work:/work/scm-work
      - artifacts:/work/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy

  # TLB：对外 HTTP 入口，按路径转到前端 / 平台 API / 各服务 AGW。
  tlb:
    build:
      context: .
      dockerfile: Dockerfile.tlb
    image: minikitex-tlb:local
    hostname: tlb
    labels:
      psm: tlb
    ports:
      - "80:80"
    volumes:
      - ${HOST_ROOT:-.}/tlb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - platform

  mysql:
    image: mysql:8.0.40
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: minikitex
      MYSQL_DATABASE: minikitex
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pminikitex"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  adminer:
    image: adminer:4.8.1
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "18081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ${HOST_ROOT:-.}/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ${HOST_ROOT:-.}/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ${HOST_ROOT:-.}/observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus

volumes:
  mysql-data:
  scm-work:
  artifacts:
