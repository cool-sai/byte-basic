services:
  consul:
    build:
      context: .
      dockerfile: Dockerfile.consul
    image: minikitex-consul:local
    hostname: consul
    command: ["agent", "-dev", "-client=0.0.0.0", "-bind=0.0.0.0", "-ui"]
    ports:
      - "8500:8500"

  etcd:
    build:
      context: .
      dockerfile: Dockerfile.etcd
    image: minikitex-etcd:local
    hostname: etcd
    command:
      - --name=etcd
      - --data-dir=/data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    tmpfs:
      - /data

  etcdui:
    image: minikitex:local
    command: ["/usr/local/bin/etcdui"]
    environment:
      LISTEN: "0.0.0.0:2381"
      ETCD: "http://etcd:2379"
    ports:
      - "2381:2381"
    depends_on:
      - etcd

  user-1:
    build: .
    image: minikitex:local
    command: ["/usr/local/bin/user"]
    hostname: user-1
    environment:
      LISTEN: "0.0.0.0:8888"
      INSTANCE: user-1
      REGISTRY: "http://consul:8500"
      SERVICE_NAME: "user"
      ADVERTISE: "user-1:8888"
      PSM: "user"
      METRICS: "0.0.0.0:9091"
      JAEGER: "http://jaeger:9411/api/v2/spans"
      CONFIG: "http://etcd:2379"
    labels:
      psm: user
    expose:
      - "8888"
      - "9091"
    depends_on:
      - consul
      - jaeger
      - etcd

  user-2:
    build: .
    image: minikitex:local
    command: ["/usr/local/bin/user"]
    hostname: user-2
    environment:
      LISTEN: "0.0.0.0:8888"
      INSTANCE: user-2
      REGISTRY: "http://consul:8500"
      SERVICE_NAME: "user"
      ADVERTISE: "user-2:8888"
      PSM: "user"
      METRICS: "0.0.0.0:9091"
      JAEGER: "http://jaeger:9411/api/v2/spans"
      CONFIG: "http://etcd:2379"
    labels:
      psm: user
    expose:
      - "8888"
      - "9091"
    depends_on:
      - consul
      - jaeger
      - etcd

  order:
    build: .
    image: minikitex:local
    command: ["/usr/local/bin/order"]
    hostname: order-1
    environment:
      LISTEN: "0.0.0.0:8889"
      INSTANCE: order-1
      REGISTRY: "http://consul:8500"
      SERVICE_NAME: "user"
      PSM: "order"
      METRICS: "0.0.0.0:9091"
      JAEGER: "http://jaeger:9411/api/v2/spans"
    labels:
      psm: order
    ports:
      - "8889:8889"
    expose:
      - "9091"
    depends_on:
      - consul
      - user-1
      - user-2
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - user-1
      - user-2
      - order

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
