global:
  scrape_interval: 2s

scrape_configs:
  - job_name: rpc
    static_configs:
      - targets: ["user-1:9091"]
        labels:
          psm: user
          instance: user-1
      - targets: ["user-2:9091"]
        labels:
          psm: user
          instance: user-2
      - targets: ["order:9091"]
        labels:
          psm: order
          instance: order-1
