<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>刷题看板</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e7ecf3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main { width: min(920px, 92vw); padding: 32px 0 48px; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; font-weight: 650; }
    .meta { color: #8b98a5; font-size: 0.95rem; min-height: 1.4em; }
    .err { color: #f7b267; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .card {
      background: #1a2330;
      border: 1px solid #2b3848;
      border-radius: 16px;
      padding: 22px 20px 18px;
    }
    .label { color: #8b98a5; font-size: 0.9rem; }
    .num { font-size: 3rem; font-weight: 700; letter-spacing: -0.04em; margin-top: 8px; }
    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      .num { font-size: 2.4rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>刷题看板</h1>
    <p id="meta" class="meta">加载中…</p>
    <p class="meta"><a href="/board/kinds/" style="color:#8b98a5">种类列表</a>　<a href="/board/tools/" style="color:#8b98a5">MCP 工具</a>　<a href="/board/tokens/" style="color:#8b98a5">token 管理</a></p>
    <div id="cards" class="cards"></div>
  </main>
  <script>
    const meta = document.getElementById("meta");
    const cards = document.getElementById("cards");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const card = (label, n, href) => href
      ? `<a class="card" href="${href}" style="display:block;text-decoration:none;color:inherit"><div class="label">${esc(label)}</div><div class="num">${n}</div></a>`
      : `<div class="card"><div class="label">${esc(label)}</div><div class="num">${n}</div></div>`;
    fetch("/board/api/kv/stats", { cache: "no-store" })
      .then(async (r) => {
        if (!r.ok) throw new Error("fail");
        return r.json();
      })
      .then((d) => {
        const kinds = d.kinds || [];
        if (!kinds.length) throw new Error("empty");
        cards.innerHTML = kinds.map((k) => card(k.name, k.count ?? 0, "/board/kinds/?kind=" + encodeURIComponent(k.name))).join("") + card("合计", d.total ?? 0);
        meta.textContent = d.updated_at ? "更新于 " + d.updated_at : "";
      })
      .catch((e) => {
        meta.classList.add("err");
        meta.textContent = e.message === "empty" ? "暂无数据" : "拉取失败";
      });
  </script>
</body>
</html>
