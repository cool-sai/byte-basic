<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>种类列表</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e7ecf3;
    }
    main { width: min(960px, 94vw); margin: 0 auto; padding: 36px 0 56px; }
    h1 { margin: 0 0 6px; font-size: 1.4rem; font-weight: 650; }
    .meta { color: #8b98a5; font-size: 0.95rem; margin: 0 0 22px; }
    a { color: #8b98a5; }
    .err { color: #f7b267; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      background: #1a2330;
      border: 1px solid #2b3848;
      border-radius: 16px;
      padding: 22px 20px 18px;
      text-decoration: none;
      color: inherit;
    }
    .card:hover { border-color: #3d8bfd; }
    .label { color: #8b98a5; font-size: 0.9rem; }
    .num { font-size: 2.4rem; font-weight: 700; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #2b3848; font-size: 0.92rem; vertical-align: top; }
    th { color: #8b98a5; font-weight: 500; }
    .content { white-space: pre-wrap; word-break: break-word; }
    .item-html a { color: #3d8bfd; }
    .item-html h1, .item-html h2, .item-html h3, .item-html p { margin: 0 0 8px; }
    .pager { display: flex; gap: 12px; align-items: center; margin-top: 18px; }
    button {
      background: #2b3848;
      color: #e7ecf3;
      border: 0;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">种类</h1>
    <p class="meta"><a href="/board/">← 看板</a>　<a href="/board/tools/">MCP 工具</a></p>
    <p id="msg" class="meta"></p>
    <div id="root"></div>
  </main>
  <script>
    const qs = new URLSearchParams(location.search);
    const kind = qs.get("kind") || "";
    const page = Math.max(1, parseInt(qs.get("page") || "1", 10));
    const size = 20;
    const root = document.getElementById("root");
    const msg = document.getElementById("msg");
    const title = document.getElementById("title");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function go(k, p) {
      const u = new URL("/board/kinds/", location.origin);
      if (k) u.searchParams.set("kind", k);
      if (p && p > 1) u.searchParams.set("page", String(p));
      location.href = u.pathname + u.search;
    }

    if (!kind) {
      fetch("/board/api/kv/stats", { cache: "no-store" })
        .then((r) => { if (!r.ok) throw new Error("fail"); return r.json(); })
        .then((d) => {
          const kinds = d.kinds || [];
          if (!kinds.length) { msg.textContent = "暂无种类"; return; }
          msg.textContent = "点进去看这个种类的列表";
          root.innerHTML = `<div class="cards">${kinds.map((k) =>
            `<a class="card" href="/board/kinds/?kind=${encodeURIComponent(k.name)}"><div class="label">${esc(k.name)}</div><div class="num">${k.count ?? 0}</div></a>`
          ).join("")}</div>`;
        })
        .catch(() => { msg.classList.add("err"); msg.textContent = "拉取失败"; });
    } else {
      title.textContent = kind;
      msg.innerHTML = `<a href="/board/kinds/">← 全部种类</a>`;
      fetch(`/board/api/items?kind=${encodeURIComponent(kind)}&page=${page}&page_size=${size}`, { cache: "no-store" })
        .then((r) => { if (r.status === 404) throw new Error("empty"); if (!r.ok) throw new Error("fail"); return r.json(); })
        .then((d) => {
          const items = d.items || [];
          const total = d.total || 0;
          const pages = Math.max(1, Math.ceil(total / (d.page_size || size)));
          if (!items.length) {
            root.innerHTML = `<p class="meta">这个种类还没有条目</p>`;
            return;
          }
          const rows = items.map((it) => {
            const body = it.rendered
              ? `<div class="item-html">${it.rendered}</div>`
              : `<div class="content">${esc(it.content || "")}</div>`;
            return `<tr><td>${it.id}</td><td>${esc(it.date || "")}</td><td>${esc(it.type || "")}</td><td>${body}</td></tr>`;
          }).join("");
          root.innerHTML = `
            <table>
              <thead><tr><th>id</th><th>日期</th><th>type</th><th>内容</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            <div class="pager">
              <button id="prev" ${page <= 1 ? "disabled" : ""}>上一页</button>
              <span class="meta">第 ${d.page} / ${pages} 页，共 ${total} 条</span>
              <button id="next" ${page >= pages ? "disabled" : ""}>下一页</button>
            </div>`;
          const prev = document.getElementById("prev");
          const next = document.getElementById("next");
          if (prev) prev.onclick = () => go(kind, page - 1);
          if (next) next.onclick = () => go(kind, page + 1);
        })
        .catch((e) => { msg.classList.add("err"); msg.textContent = e.message === "empty" ? "没有这个种类" : "拉取失败"; });
    }
  </script>
</body>
</html>
