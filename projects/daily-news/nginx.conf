# daily-news 镜像内的 nginx 站点配置（构建时 COPY 为 /etc/nginx/conf.d/default.conf）。
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # 晨报正文 data/YYYY-MM-DD.md 必须可访问（regex location 按顺序匹配，放在禁止规则之前）
    location ~ ^/data/[^/]+\.md$ {
        default_type text/markdown;
        add_header Cache-Control "no-cache" always;
    }

    # 隐藏文件（.git、.github 等）、部署脚本和源码说明一律 404
    location ~ /\.            { return 404; }
    location ^~ /deploy/      { return 404; }
    location ~ \.(py|sh|md)$  { return 404; }

    location ~ \.json$ {
        add_header Cache-Control "public, max-age=300" always;
    }

    location ~ \.html?$ {
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
