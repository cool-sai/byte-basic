# pages.lssl.work 静态站 + /api/data → board /data（B2）
# 镜像内：
#   /usr/share/nginx/html/home/   ← 构建产物 dist/home
#   /usr/share/nginx/html/shell/  ← 构建产物 dist/shell

upstream board_data {
    server board:8090;
    keepalive 8;
}

map $sent_http_content_type $pages_csp {
    default "";
    ~*text/html "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'";
}

server {
    listen 80 default_server;
    server_name _;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/plain;

    # 同域读接口：浏览器 /api/data/... → board /data/...
    location ^~ /api/data/ {
        proxy_pass http://board_data/data/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # 旧 MPA 路径 → 通用壳
    location = /news/daily { return 301 /news/; }
    location = /news/daily/ { return 301 /news/; }
    location = /finance/digest { return 301 /finance/; }
    location = /finance/digest/ { return 301 /finance/; }
    location = /life/daily { return 301 /life/; }
    location = /life/daily/ { return 301 /life/; }

    # 首页资源（构建 base=/home/）
    location ^~ /home/ {
        alias /usr/share/nginx/html/home/;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $pages_csp always;
    }

    location = / {
        root /usr/share/nginx/html/home;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $pages_csp always;
    }

    # /{module} → /{module}/
    location ~ ^/[a-z0-9][a-z0-9_-]*$ {
        return 301 $uri/;
    }

    # /{module}/ → shell/index.html
    location ~ ^/[a-z0-9][a-z0-9_-]+/$ {
        rewrite ^ /index.html break;
        root /usr/share/nginx/html/shell;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $pages_csp always;
    }

    # /{module}/detail.html|assets/… → shell 同名文件
    location ~ ^/[a-z0-9][a-z0-9_-]+/(.+)$ {
        rewrite ^/[a-z0-9][a-z0-9_-]+/(.*)$ /$1 break;
        root /usr/share/nginx/html/shell;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $pages_csp always;
    }

    location = /favicon.ico { return 204; }

    location / {
        return 404;
    }
}
