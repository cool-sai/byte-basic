# pages.lssl.work 静态站 + /api/data → board /data（B2）
# board 主机名用变量，避免 docker build 时 nginx -t 解析失败

map $sent_http_content_type $pages_csp {
    default "";
    ~*text/html "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'";
}

server {
    listen 80 default_server;
    server_name _;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # Docker embedded DNS；变量 proxy_pass 会在请求时再解析 board
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/plain;

    location ^~ /api/data/ {
        set $board_upstream board:8090;
        proxy_pass http://$board_upstream/data/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host board;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /news/daily { return 301 /news/; }
    location = /news/daily/ { return 301 /news/; }
    location = /finance/digest { return 301 /finance/; }
    location = /finance/digest/ { return 301 /finance/; }
    location = /life/daily { return 301 /life/; }
    location = /life/daily/ { return 301 /life/; }

    location ^~ /home/ {
        alias /usr/share/nginx/html/home/;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $pages_csp always;
    }

    location = / {
        root /usr/share/nginx/html/home;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $pages_csp always;
    }

    location ~ ^/[a-z0-9][a-z0-9_-]*$ {
        return 301 $uri/;
    }

    location ~ ^/[a-z0-9][a-z0-9_-]+/$ {
        rewrite ^ /index.html break;
        root /usr/share/nginx/html/shell;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $pages_csp always;
    }

    location ~ ^/[a-z0-9][a-z0-9_-]+/(.+)$ {
        rewrite ^/[a-z0-9][a-z0-9_-]+/(.*)$ /$1 break;
        root /usr/share/nginx/html/shell;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $pages_csp always;
    }

    location = /favicon.ico { return 204; }

    location / {
        return 404;
    }
}
