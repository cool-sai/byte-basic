worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /acme;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name lssl.work www.lssl.work;
        client_max_body_size 32m;
        ssl_certificate /etc/letsencrypt/live/lssl.work/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lssl.work/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /order {
            set $tlb_upstream order:8080;
            proxy_pass http://$tlb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /platform.v1.PlatformService {
            set $tlb_upstream platform:8081;
            proxy_pass http://$tlb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /api {
            set $tlb_upstream platform:8081;
            proxy_pass http://$tlb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location / {
            set $tlb_upstream platform:8081;
            proxy_pass http://$tlb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
